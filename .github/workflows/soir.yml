name: Top 3 du soir

on:
  schedule:
    # 18 h 30 à Paris, du lundi au vendredi (17 h 30 UTC l'hiver).
    # GitHub retarde parfois de quelques minutes aux heures chargées.
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      jour:
        description: "Date à classer (AAAA-MM-JJ). Vide = aujourd'hui."
        required: false
        default: ""

permissions:
  contents: write      # pour committer les fichiers top3/ et le profil ajusté
  issues: write        # pour ouvrir ou compléter l'issue du soir
  pull-requests: write # requis par certaines versions de l'action issues

jobs:
  top3:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Appliquer la réponse d'hier
        run: python3 scripts/boucle.py
        env:
          PROFIL_TOKEN: ${{ secrets.PROFIL_TOKEN }}
        continue-on-error: true

      - name: Construire le top 3
        id: classement
        run: |
          python3 scripts/soir.py --profil data/profil.json \
            ${JOUR:+--jour "$JOUR"} > sortie.txt 2> journal.txt
          cat journal.txt
          echo "--- top 3 ---"
          cat sortie.txt
        env:
          JOUR: ${{ inputs.jour }}
        continue-on-error: true

      - name: Publier les fichiers dans le dépôt
        run: |
          git config user.name "top3-bot"
          git config user.email "top3-bot@users.noreply.github.com"
          git add top3/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "Top 3 du $(date -u +%Y-%m-%d)"
            git push
          fi

      # Réutilise l'issue du jour si elle existe, et la complète par un
      # commentaire. Une seule issue par date, même si le workflow tourne
      # plusieurs fois dans la journée.
      - name: Publier le top 3 dans l'issue du jour
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // La date visée : celle demandée, sinon celle du jour.
            let jour = "${{ inputs.jour }}";
            if (!jour) {
              jour = new Date().toISOString().slice(0, 10);
            }

            // Le corps : le top 3 s'il existe, le journal sinon.
            let corps;
            try {
              const sortie = fs.readFileSync('sortie.txt', 'utf8').trim();
              if (sortie) {
                corps = "```\n" + sortie + "\n```\n\n"
                      + "Fichier à consulter : [`top3/dernier.md`](../blob/main/top3/dernier.md)\n\n"
                      + "Réponds en commentaire, **uniquement** : `1`, `2`, `3` ou `aucun`.";
              }
            } catch (e) {}

            if (!corps) {
              corps = "Le classement n'a pas pu être produit.\n\n```\n";
              try {
                corps += fs.readFileSync('journal.txt', 'utf8').slice(-3000) + "\n```";
              } catch (e) {
                corps += "aucun journal\n```";
              }
            }

            const titre = "Top 3 du soir — " + jour;

            // Chercher une issue portant déjà ce titre.
            const { data: existantes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const deja = existantes.find(i => i.title === titre);

            if (deja) {
              // Issue existante : on la complète au lieu d'en créer une autre.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: deja.number,
                body: corps,
              });
              console.log(`Issue #${deja.number} complétée.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titre,
                body: corps,
              });
              console.log("Nouvelle issue ouverte.");
            }
